<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23050812'/%3E%3Cpath d='M7 25 12 7m13 18L20 7M11 18h10' fill='none' stroke='%2334d8ff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preload" as="image" href="/images/city-of-speedrunners-loading-v2.webp" fetchpriority="high" />
    <style>
      #boot-screen { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; overflow: hidden; background: #050812; color: #fff; font-family: Inter, system-ui, sans-serif; text-align: center; }
      #boot-screen::before { position: absolute; inset: 0; content: ""; background: linear-gradient(90deg, rgba(3,6,14,.56), rgba(3,6,14,.18), rgba(3,6,14,.48)), url("/images/city-of-speedrunners-loading-v2.webp") center / cover no-repeat; opacity: .8; }
      #boot-screen > div { position: relative; padding: 24px; }
      #boot-screen h1 { margin: 0; color: #fff1f4; font: 900 italic clamp(2rem, 7vw, 4.5rem)/.95 system-ui, sans-serif; letter-spacing: .055em; text-shadow: 0 0 12px #ff5c85, 0 0 30px rgba(45,214,255,.5); }
      #boot-screen p { margin: 18px 0 0; color: rgba(255,255,255,.78); font: 500 12px/1.5 ui-monospace, monospace; letter-spacing: .16em; text-transform: uppercase; }
      #boot-screen span { display: inline-block; width: 22px; height: 22px; margin-top: 24px; border: 2px solid rgba(255,255,255,.2); border-top-color: #55e7ff; border-radius: 50%; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot-screen span { animation-duration: 2s; } }
    </style>
    <title>CITY OF SPEEDRUNNERS</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-screen" role="status" aria-live="polite" aria-label="Loading CITY OF SPEEDRUNNERS">
      <div>
        <h1>CITY OF SPEEDRUNNERS</h1>
        <p>Preparing the garage</p>
        <span aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
